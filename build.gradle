plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'org.jetbrains.intellij.platform' version '2.2.1'
}

group 'net.p35'
version "$version"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2024.2.4')
        pluginVerifier()
        zipSigner()
        instrumentationTools()
    }
    testImplementation 'junit:junit:4.13.2'
}

compileKotlin {
    kotlinOptions.jvmTarget = "21"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "21"
}

intellijPlatform {
    pluginConfiguration {
        id = 'net.p35.common-enum-values'
        name = 'Developers Macro'
        version = project.version

        ideaVersion {
            sinceBuild = "242"
            untilBuild = provider { null }
        }

        changeNotes = """
          <ul>
            <li>Compatibility with 2024.2+ through 2026.1+ IDEs.</li>
            <li>Migrated runtime to Java 21.</li>
            <li>Replaced legacy UI Designer form with Kotlin UI DSL v2.</li>
          </ul>
        """
    }

    publishing {
        token = providers.environmentVariable("ORG_GRADLE_PROJECT_intellijPublishToken")
            .orElse(providers.gradleProperty("intellijPublishToken"))
    }

    pluginVerification {
        ides {
            recommended()
        }
    }
}
